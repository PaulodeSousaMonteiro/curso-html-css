<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        h1{
            text-align: center;
        }
        table{
            border-collapse: collapse;
            position: relative;
            margin: auto;
        }
        caption{
            font-size: 1.3em;
            font-weight: bold;
            padding: 10px;
        }
        th, td{
            border: 1px solid black;
            padding: 10px;
        }
        .titulo{
            background-color: grey;
            color: white;
        }
        .num{
            text-align: center;
        }
        .numi{
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr class="titulo">
                <th rowspan="2" scope="col">Área</th>
                <th rowspan="2" scope="col">Disciplinas</th>
                <th colspan="2" scope="colgroup">Notas</th>
                <th rowspan="2" scope="col">Média</th>
            </tr>
            <tr class="titulo">
                <th scope="col">Nota 1</th>
                <th scope="col">Nota 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="4" scope="rowgroup">Exatas</th>
                <td>Matemática</td>
                <td class="num">8.5</td>
                <td class="num">10.0</td>
                <td class="num">9.2</td>
            </tr>
            <tr>
                <td>Física</td>
                <td class="num">7.5</td>
                <td class="num">5.5</td>
                <td class="num">6.5</td>
            </tr>
            <tr>
                <td>Química</td>
                <td class="num">10.0</td>
                <td class="num">5.0</td>
                <td class="num">7.5</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td class="num">5.0</td>
                <td class="num">9.8</td>
                <td class="num">7.4</td>
            </tr>
            <tr class="titulo">
                <th colspan="4" scope="row">Média de Exatas</th>
                <td class="numi">7.65</td>
            </tr>
            <tr>
                <th rowspan="2" scope="rowgroup">Humanas</th>
                <td>História</td>
                <td class="num">8.0</td>
                <td class="num">4.0</td>
                <td class="num">6.0</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td class="num">10.0</td>
                <td class="num">7.0</td>
                <td class="num">8.5</td>
            </tr>
            <tr class="titulo">
                <th colspan="4" scope="row">Média de Humanas</th>
                <td class="numi">7.25</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
