<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner{
            background-color: lightcoral;

            display: flex;
            flex-flow: row nowrap;
        }

        div.item{
            background-color: lightseagreen;
            border: 1px solid black;
            text-align: center;
        }

        div#cxA{
            /*
            flex-grow: 1;
            flex-shrink: 0;
            flex-basis: 200px;
            */

            flex: 1 0 200px;  /* ORDEM: grow + shrink + basis*/
        }

        div#cxB{
            /*
            flex-grow: 1;
            flex-shrink: 1;
            flex-basis: 200px;
            */

            flex: 1 1 200px;  /* ORDEM: grow + shrink + basis*/
        }

        div#cxC{
            /*
            flex-grow: 1;
            flex-shrink: 8;
            flex-basis: auto;
            */

            flex: 1 8 auto;  /* ORDEM: grow + shrink + basis*/
        }
        /*
        CONFIGURAÇÕES "FLEX" PARA ITENS/FILHOS
            flex: 0 1 auto; == flex; initial; Configuração padrão 

            flex: 0 0 auto; == flex: none; Sem nenhuma flexibilidade 

            flex: 1 1 auto; == fle: auto; Totalmente flexivel 

            flex: 3; == flex: 3 1 auto; Configuração apenas do grow e o resto fica padrão
        */
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="cxA">A</div>
        <div class="item" id="cxB">B</div>
        <div class="item" id="cxC">C</div>
    </div>
</body>
</html>
